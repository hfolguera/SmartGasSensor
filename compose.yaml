services:
  smartgas:
    build: .
    image: smartgassensor:local
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - smartgas-data:/data
      - ./config/tanks.json:/config/tanks.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 20s
volumes:
  smartgas-data:
