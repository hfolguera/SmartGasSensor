apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smartgassensor
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - pvc.yaml
configMapGenerator:
  - name: smartgassensor-config
    literals:
      - MQTT_ENABLED=true
      - MQTT_HOST=192.168.1.216
      - MQTT_PORT=1883
      - MQTT_TOPIC=home/gas/telemetry
      - MQTT_CLIENT_ID=smartgassensor-production
      - MQTT_TLS=false
      - DB_PATH=/data/smartgassensor.db
      - TANK_CONFIG_PATH=/config/tanks.json
      - STALE_AFTER_SECONDS=10800
      - RETENTION_DAYS=3650
      - CONSUMPTION_SINCE=2026-11-06T00:00:00+01:00
      - CONSUMPTION_NOISE_LITERS=5
      - CONSUMPTION_REFILL_LITERS=50
      - CONSUMPTION_MAX_GAP_SECONDS=10800
      - NTFY_ENABLED=true
      - NTFY_SERVER_URL=https://ntfy.calfolguera.freemyip.com
      - NTFY_TOPIC=home-notifications
      - NTFY_HYSTERESIS_PERCENT=5
      - PUBLIC_WEB_URL=https://smartgassensor.calfolguera.freemyip.com
  - name: smartgassensor-tanks
    files:
      - tanks.json
images:
  - name: ghcr.io/hfolguera/smartgassensor
    newName: ghcr.io/hfolguera/smartgassensor
    newTag: latest
