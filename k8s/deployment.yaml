apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartgassensor
  labels:
    app.kubernetes.io/name: smartgassensor
spec:
  replicas: 1
  # Un únic consumidor amb client ID estable i una única SQLite sobre PVC.
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: smartgassensor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartgassensor
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smartgassensor
          image: ghcr.io/hfolguera/smartgassensor:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: smartgassensor-config
            - secretRef:
                name: smartgassensor-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tanks
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: smartgassensor-data
        - name: tanks
          configMap:
            name: smartgassensor-tanks
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
